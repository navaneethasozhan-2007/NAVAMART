<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c5b3"/>
      <stop offset="50%" stop-color="#bfae9b"/>
      <stop offset="100%" stop-color="#9a8775"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="40%" stop-color="#1e1838"/>
      <stop offset="80%" stop-color="#c87941"/>
      <stop offset="100%" stop-color="#ffb070"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(115, 35)" filter="url(#shadow)">
    <!-- Outer phone body -->
    <rect x="0" y="0" width="170" height="330" rx="36" fill="url(#titanium)" stroke="#8d7764" stroke-width="2"/>
    <!-- Inner bezel -->
    <rect x="4" y="4" width="162" height="322" rx="32" fill="#000"/>
    <!-- Screen -->
    <rect x="7" y="7" width="156" height="316" rx="29" fill="url(#screen)"/>
    <!-- Dynamic Island -->
    <rect x="63" y="15" width="44" height="13" rx="6.5" fill="#000"/>
    <!-- Camera control button -->
    <rect x="170" y="195" width="3" height="28" rx="1.5" fill="#8d7764"/>
    <!-- Power button -->
    <rect x="170" y="95" width="3" height="38" rx="1.5" fill="#8d7764"/>
    <!-- Volume buttons -->
    <rect x="-3" y="85" width="3" height="22" rx="1.5" fill="#8d7764"/>
    <rect x="-3" y="115" width="3" height="22" rx="1.5" fill="#8d7764"/>
    <!-- Wallpaper wave accent -->
    <circle cx="85" cy="240" r="60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="24" stroke-dasharray="80 30"/>
    <circle cx="85" cy="240" r="35" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="12"/>
    <!-- Home bar -->
    <rect x="60" y="312" width="50" height="3" rx="1.5" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>