    <ellipse cx="175" cy="205" rx="30" ry="48" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <ellipse cx="175" cy="205" rx="20" ry="36" fill="#0f172a"/>
    <!-- Gold Sony Wordmark Accent -->
