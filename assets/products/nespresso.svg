<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(100, 60)">
    <!-- Water Tank (back) -->
    <rect x="15" y="40" width="45" height="190" rx="14" fill="#bae6fd" stroke="#0284c7" stroke-width="2" opacity="0.8"/>
    <!-- Machine Body (Cyan Blue) -->
    <path d="M 60 40 L 160 40 L 160 230 L 60 230 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <!-- Head Brew Unit -->
    <path d="M 120 40 C 180 40 180 110 130 110 L 60 110 Z" fill="#0369a1"/>
    <!-- Coffee Spout -->
    <rect x="145" y="110" width="8" height="16" fill="#475569"/>
    <!-- Coffee Cup on Tray -->
    <path d="M 130 145 L 170 145 L 165 195 L 135 195 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Crema in cup -->
    <ellipse cx="150" cy="155" rx="15" ry="5" fill="#b45309"/>
    <!-- Cup Handle -->
    <path d="M 170 155 C 185 155 185 185 167 185" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Drip Tray -->
    <rect x="120" y="195" width="60" height="35" rx="6" fill="#334155"/>
  </g>
</svg>