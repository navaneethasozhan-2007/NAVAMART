<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(60, 50)">
    <!-- Collar -->
    <polygon points="100,50 140,25 180,50 155,75 125,75" fill="#1d4ed8" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M 70 70 L 210 70 L 225 260 L 55 260 Z" fill="url(#denim)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Left Sleeve -->
    <polygon points="70,70 20,110 40,240 70,220" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Right Sleeve -->
    <polygon points="210,70 260,110 240,240 210,220" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Chest Pockets -->
    <rect x="85" y="105" width="40" height="40" rx="4" fill="#1e40af" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="155" y="105" width="40" height="40" rx="4" fill="#1e40af" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Red Tab -->
    <rect x="123" y="112" width="6" height="12" fill="#ef4444"/>
    <!-- Buttons -->
    <circle cx="140" cy="100" r="4" fill="#e2e8f0"/>
    <circle cx="140" cy="140" r="4" fill="#e2e8f0"/>
    <circle cx="140" cy="180" r="4" fill="#e2e8f0"/>
    <circle cx="140" cy="220" r="4" fill="#e2e8f0"/>
  </g>
</svg>