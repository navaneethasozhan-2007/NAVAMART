<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="olednebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#4c1d95"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(40, 80)">
    <!-- Thin Frame -->
    <rect x="0" y="0" width="320" height="190" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="4" y="4" width="312" height="182" fill="url(#olednebula)"/>
    <!-- Cosmic swirl -->
    <circle cx="160" cy="95" r="50" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="80 20"/>
    <!-- Stand -->
    <polygon points="120,190 200,190 220,225 100,225" fill="#475569"/>
    <rect x="80" y="225" width="160" height="6" rx="3" fill="#334155"/>
  </g>
</svg>