<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="macbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="macscreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(45, 75)">
    <!-- Display Shell -->
    <rect x="35" y="0" width="240" height="160" rx="10" fill="url(#macbg)" stroke="#374151" stroke-width="2"/>
    <rect x="42" y="7" width="226" height="146" rx="6" fill="#000"/>
    <rect x="45" y="10" width="220" height="140" rx="4" fill="url(#macscreen)"/>
    <!-- Notch -->
    <rect x="145" y="10" width="20" height="7" rx="3.5" fill="#000"/>
    <!-- Glowing wallpaper lines -->
    <path d="M 60 110 Q 155 30 250 120" fill="none" stroke="#a5f3fc" stroke-width="4" opacity="0.8"/>
    <!-- Base / Bottom Body -->
    <path d="M 10 162 L 300 162 L 285 188 L 25 188 Z" fill="#2d333b" stroke="#1f242d" stroke-width="2"/>
    <!-- Thumb notch -->
    <rect x="135" y="162" width="40" height="4" rx="2" fill="#181a1f"/>
    <!-- Feet -->
    <rect x="35" y="188" width="24" height="3" rx="1.5" fill="#111"/>
    <rect x="251" y="188" width="24" height="3" rx="1.5" fill="#111"/>
  </g>
</svg>