<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldtin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(90, 80)">
    <!-- Gift Tin Base -->
    <rect x="20" y="90" width="180" height="140" rx="16" fill="url(#goldtin)" stroke="#854d0e" stroke-width="2"/>
    <!-- Festive Red Silk Ribbon -->
    <rect x="95" y="90" width="30" height="140" fill="#dc2626"/>
    <!-- Ribbon Bow -->
    <path d="M 110 80 C 80 50 60 90 100 85 Z" fill="#ef4444"/>
    <path d="M 110 80 C 140 50 160 90 120 85 Z" fill="#ef4444"/>
    <circle cx="110" cy="85" r="8" fill="#b91c1c"/>
    <!-- Overflowing Cashews and Almonds -->
    <ellipse cx="60" cy="80" rx="14" ry="9" fill="#fef08a" transform="rotate(-15 60 80)"/>
    <ellipse cx="85" cy="72" rx="16" ry="8" fill="#b45309" transform="rotate(25 85 72)"/>
    <ellipse cx="135" cy="70" rx="15" ry="9" fill="#fef08a" transform="rotate(-20 135 70)"/>
    <ellipse cx="160" cy="82" rx="16" ry="9" fill="#b45309" transform="rotate(30 160 82)"/>
    <!-- Royal Badge on Tin -->
    <circle cx="110" cy="155" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="110" y="160" fill="#854d0e" font-size="10" font-weight="bold" text-anchor="middle" font-family="serif">ROYAL</text>
  </g>
</svg>