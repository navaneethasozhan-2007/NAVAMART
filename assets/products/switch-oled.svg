<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(60, 110)">
    <!-- Left Joy-Con (Neon Blue) -->
    <path d="M 40 10 C 20 10 10 30 10 60 L 10 120 C 10 150 20 170 40 170 L 50 170 L 50 10 Z" fill="#00b4d8"/>
    <!-- Left Joystick & D-pad -->
    <circle cx="30" cy="50" r="12" fill="#1e293b"/>
    <circle cx="30" cy="115" r="5" fill="#1e293b"/>
    <circle cx="20" cy="125" r="5" fill="#1e293b"/>
    <circle cx="40" cy="125" r="5" fill="#1e293b"/>
    <circle cx="30" cy="135" r="5" fill="#1e293b"/>
    <!-- OLED Screen Tablet Unit -->
    <rect x="50" y="10" width="180" height="160" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="18" width="160" height="144" rx="2" fill="#111827"/>
    <!-- Glowing OLED screen gradient -->
    <rect x="64" y="22" width="152" height="136" rx="2" fill="#1e1b4b"/>
    <circle cx="140" cy="90" r="35" fill="none" stroke="#ec4899" stroke-width="4"/>
    <!-- Right Joy-Con (Neon Red) -->
    <path d="M 230 10 L 240 10 C 260 10 270 30 270 60 L 270 120 C 270 150 260 170 240 170 L 230 170 Z" fill="#ff4757"/>
    <!-- Right Buttons & Joystick -->
    <circle cx="250" cy="50" r="5" fill="#1e293b"/>
    <circle cx="240" cy="60" r="5" fill="#1e293b"/>
    <circle cx="260" cy="60" r="5" fill="#1e293b"/>
    <circle cx="250" cy="70" r="5" fill="#1e293b"/>
    <circle cx="250" cy="125" r="12" fill="#1e293b"/>
  </g>
</svg>