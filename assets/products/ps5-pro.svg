<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8f9fa"/>
  <g transform="translate(125, 40)">
    <!-- Base stand -->
    <ellipse cx="75" cy="305" rx="60" ry="15" fill="#1e293b"/>
    <!-- Center Black Core -->
    <path d="M 50 40 L 100 40 L 95 300 L 55 300 Z" fill="#090d16"/>
    <!-- Glowing Blue Light Strip -->
    <line x1="56" y1="45" x2="59" y2="295" stroke="#38bdf8" stroke-width="3"/>
    <line x1="94" y1="45" x2="91" y2="295" stroke="#38bdf8" stroke-width="3"/>
    <!-- Left Curved White Fin -->
    <path d="M 50 35 C 30 70 30 250 55 300 L 45 295 C 15 240 15 70 45 35 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Right Curved White Fin -->
    <path d="M 100 35 C 120 70 120 250 95 300 L 105 295 C 135 240 135 70 105 35 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Racing stripes on side (PS5 Pro signature) -->
    <line x1="45" y1="160" x2="25" y2="160" stroke="#090d16" stroke-width="3"/>
    <line x1="45" y1="170" x2="25" y2="170" stroke="#090d16" stroke-width="3"/>
    <line x1="45" y1="180" x2="25" y2="180" stroke="#090d16" stroke-width="3"/>
  </g>
</svg>